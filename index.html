
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .tab-active { border-bottom: 4px solid #f59e0b; color: white; }
        .priority-high { border-left: 6px solid #ef4444; }
        .priority-med { border-left: 6px solid #eab308; }
        .priority-low { border-left: 6px solid #22c55e; }
        .prio-pill {
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-item:hover .tab-delete-btn { opacity: 1; }
        .tab-delete-btn {
            opacity: 0;
            transition: opacity 0.15s;
        }
        @media (hover: none) {
            .tab-delete-btn { opacity: 0.6; }
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div class="max-w-xl mx-auto">
        <!-- Header -->
        <div class="sticky top-0 bg-zinc-900 border-b border-zinc-800 z-50">
            <div class="px-4 py-4 flex items-center justify-between">
                <h1 class="text-3xl font-bold tracking-tight">Responses</h1>
                <button onclick="addNewTab()" 
                        class="flex items-center gap-2 bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-xl text-sm font-medium">
                    <i class="fas fa-plus"></i> Add Tab
                </button>
            </div>
            <div id="tabs" class="flex overflow-x-auto border-b border-zinc-800 px-2 pb-1"></div>
        </div>

        <!-- Content Area -->
        <div class="p-4" id="tab-content"></div>
    </div>

    <!-- Add Task Modal -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black/70 flex items-end sm:items-center justify-center z-50">
        <div class="bg-zinc-900 w-full max-w-xl rounded-t-3xl sm:rounded-3xl p-6">
            <h2 class="text-2xl font-semibold mb-6">Add New Task</h2>
            <input id="new-task-input" type="text" placeholder="Task description..." 
                   class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-amber-500">

            <div class="mt-6">
                <label class="block text-sm text-zinc-400 mb-2">Priority</label>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="selectPriority(0)" id="prio-0"
                            class="priority-btn bg-red-500/10 text-red-400 hover:bg-red-500/20 py-4 rounded-2xl font-medium">High</button>
                    <button onclick="selectPriority(1)" id="prio-1"
                            class="priority-btn bg-yellow-500/10 text-yellow-400 hover:bg-yellow-500/20 py-4 rounded-2xl font-medium">Medium</button>
                    <button onclick="selectPriority(2)" id="prio-2"
                            class="priority-btn bg-green-500/10 text-green-400 hover:bg-green-500/20 py-4 rounded-2xl font-medium">Low</button>
                </div>
            </div>

            <div class="flex gap-3 mt-10">
                <button onclick="closeModal()" 
                        class="flex-1 py-4 text-lg font-medium border border-zinc-700 rounded-2xl">Cancel</button>
                <button onclick="addTask()" 
                        class="flex-1 py-4 text-lg font-medium bg-amber-500 hover:bg-amber-600 text-black rounded-2xl">Add Task</button>
            </div>
        </div>
    </div>

    <!-- Delete Tab Confirm Modal -->
    <div id="delete-tab-modal" class="hidden fixed inset-0 bg-black/70 flex items-end sm:items-center justify-center z-50">
        <div class="bg-zinc-900 w-full max-w-xl rounded-t-3xl sm:rounded-3xl p-6">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-10 h-10 rounded-full bg-red-500/20 flex items-center justify-center">
                    <i class="fas fa-trash text-red-400"></i>
                </div>
                <h2 class="text-2xl font-semibold">Delete Tab?</h2>
            </div>
            <p class="text-zinc-400 mb-8">
                "<span id="delete-tab-name" class="text-white font-medium"></span>" and all its tasks will be permanently removed.
            </p>
            <div class="flex gap-3">
                <button onclick="closeDeleteTabModal()" 
                        class="flex-1 py-4 text-lg font-medium border border-zinc-700 rounded-2xl">Cancel</button>
                <button onclick="confirmDeleteTab()" 
                        class="flex-1 py-4 text-lg font-medium bg-red-500 hover:bg-red-600 text-white rounded-2xl">Delete</button>
            </div>
        </div>
    </div>

    <script>
        let tabs = [
            { id: 1, name: "Structure Fires", tasks: [
                { id: 101, text: "Perform 360° size-up and announce strategy (Offensive/Defensive)", priority: 0 },
                { id: 102, text: "Establish Command and RIC", priority: 0 },
                { id: 103, text: "Primary search / rescue", priority: 0 },
                { id: 104, text: "Advance attack lines - confine fire", priority: 1 },
                { id: 105, text: "Ventilation (coordinate horizontal/vertical)", priority: 1 },
                { id: 106, text: "Utility control (gas/electric)", priority: 1 },
                { id: 107, text: "Secondary search", priority: 2 },
                { id: 108, text: "Overhaul and salvage", priority: 2 }
            ]},
            { id: 2, name: "Car Accidents (MVCs)", tasks: [
                { id: 201, text: "Scene safety - block traffic, high visibility", priority: 0 },
                { id: 202, text: "PPE and BSI - consider airbag / battery hazards", priority: 0 },
                { id: 203, text: "Triage patients and request ALS/heavy rescue", priority: 0 },
                { id: 204, text: "Stabilize vehicles (cribbing / struts)", priority: 1 },
                { id: 205, text: "360 assessment - fuel/electrical hazards", priority: 1 },
                { id: 206, text: "Patient extrication and packaging", priority: 1 },
                { id: 207, text: "Debris cleanup coordination", priority: 2 }
            ]},
            { id: 3, name: "Gas Leaks", tasks: [
                { id: 301, text: "Approach upwind - full PPE/SCBA", priority: 0 },
                { id: 302, text: "Evacuate / deny entry to hazard area", priority: 0 },
                { id: 303, text: "Meter for LEL / O2 / CO", priority: 0 },
                { id: 304, text: "Shut off meter if safe and trained", priority: 1 },
                { id: 305, text: "Notify utility company", priority: 1 },
                { id: 306, text: "Ventilate structure safely", priority: 1 },
                { id: 307, text: "Monitor exposures", priority: 2 }
            ]},
            { id: 4, name: "Hazmat Incidents", tasks: [
                { id: 401, text: "Approach upwind/uphill/upstream - don appropriate PPE/SCBA", priority: 0 },
                { id: 402, text: "Establish Command and RIC - announce strategy", priority: 0 },
                { id: 403, text: "Isolate area / deny entry - establish zones (Hot/Warm/Cold)", priority: 0 },
                { id: 404, text: "Evacuate or shelter-in-place as needed", priority: 0 },
                { id: 405, text: "Identify material (placards, shipping papers, binoculars) - use ERG", priority: 1 },
                { id: 406, text: "Notify appropriate agencies (hazmat team, utilities, dispatch)", priority: 1 },
                { id: 407, text: "Emergency decontamination if exposed", priority: 1 },
                { id: 408, text: "Request specialized resources (Tech level team, monitoring equipment)", priority: 1 },
                { id: 409, text: "Defensive containment (diking/damming if trained)", priority: 2 },
                { id: 410, text: "Monitor weather / exposures", priority: 2 },
                { id: 411, text: "Coordinate cleanup with specialists", priority: 2 }
            ]},
            { id: 5, name: "Fire Alarms", tasks: [
                { id: 501, text: "360° size-up - check for smoke, fire, or obvious cause", priority: 0 },
                { id: 502, text: "Establish Command and announce strategy", priority: 0 },
                { id: 503, text: "Investigate activated device/zone (pull station, smoke/heat detector, water flow)", priority: 0 },
                { id: 504, text: "Primary search if warranted", priority: 0 },
                { id: 505, text: "Check fire alarm panel (alarm/supervisory/trouble signals)", priority: 1 },
                { id: 506, text: "Coordinate with building staff or monitoring company", priority: 1 },
                { id: 507, text: "Ventilate or control HVAC if needed", priority: 1 },
                { id: 508, text: "Reset panel only after all clear", priority: 2 },
                { id: 509, text: "Document incident and return to service", priority: 2 }
            ]},
            { id: 6, name: "Lines Down", tasks: [
                { id: 601, text: "Approach cautiously - treat ALL downed lines as energized", priority: 0 },
                { id: 602, text: "Establish safe exclusion zone (30ft+ distribution, 100ft+ transmission)", priority: 0 },
                { id: 603, text: "Scene safety - deny entry to public and vehicles", priority: 0 },
                { id: 604, text: "Notify utility company immediately via dispatch", priority: 0 },
                { id: 605, text: "Position apparatus safely away from poles and lines", priority: 1 },
                { id: 606, text: "Warn personnel of step potential and arc hazards", priority: 1 },
                { id: 607, text: "Keep occupants in vehicles if lines are in contact (until de-energized)", priority: 1 },
                { id: 608, text: "Coordinate with utility for de-energization and clearance", priority: 2 },
                { id: 609, text: "Document and secure scene once safe", priority: 2 }
            ]}
        ];

        let currentTabId = 1;
        let nextTaskId = 700;
        let nextTabId = 7;
        let pendingDeleteTabId = null;

        function renderTabs() {
            const container = document.getElementById('tabs');
            container.innerHTML = '';
            tabs.forEach(tab => {
                const isActive = tab.id === currentTabId;
                const div = document.createElement('div');
                div.className = `tab-item relative px-4 py-4 whitespace-nowrap font-medium cursor-pointer flex-shrink-0 transition-colors flex items-center gap-2 ${isActive ? 'tab-active text-white' : 'text-zinc-400 hover:text-zinc-200'}`;

                const nameSpan = document.createElement('span');
                nameSpan.textContent = tab.name;
                nameSpan.onclick = () => { currentTabId = tab.id; renderTabs(); renderCurrentTab(); };
                div.appendChild(nameSpan);

                // Delete button — always rendered, hover reveals via CSS
                const delBtn = document.createElement('button');
                delBtn.className = `tab-delete-btn ml-1 w-5 h-5 flex items-center justify-center rounded-full hover:bg-red-500/30 text-zinc-500 hover:text-red-400 transition-colors`;
                delBtn.innerHTML = `<i class="fas fa-times text-xs"></i>`;
                delBtn.title = `Delete "${tab.name}"`;
                delBtn.onclick = (e) => { e.stopPropagation(); showDeleteTabModal(tab.id); };
                div.appendChild(delBtn);

                container.appendChild(div);
            });
        }

        function showDeleteTabModal(tabId) {
            const tab = tabs.find(t => t.id === tabId);
            if (!tab) return;
            pendingDeleteTabId = tabId;
            document.getElementById('delete-tab-name').textContent = tab.name;
            document.getElementById('delete-tab-modal').classList.remove('hidden');
        }

        function closeDeleteTabModal() {
            pendingDeleteTabId = null;
            document.getElementById('delete-tab-modal').classList.add('hidden');
        }

        function confirmDeleteTab() {
            if (!pendingDeleteTabId) return;
            tabs = tabs.filter(t => t.id !== pendingDeleteTabId);

            // If we deleted the active tab, switch to the first available
            if (currentTabId === pendingDeleteTabId) {
                currentTabId = tabs.length > 0 ? tabs[0].id : null;
            }

            saveData();
            closeDeleteTabModal();
            renderTabs();
            renderCurrentTab();
        }

        function getPriorityHTML(task, tabId) {
            const colors = ['bg-red-500 text-white', 'bg-yellow-500 text-black', 'bg-green-500 text-white'];
            const labels = ['HIGH', 'MED', 'LOW'];
            return `
                <div onclick="changePriority(${tabId}, ${task.id}, event)" 
                     class="prio-pill ${colors[task.priority]}">
                    ${labels[task.priority]}
                </div>
            `;
        }

        function renderCurrentTab() {
            const content = document.getElementById('tab-content');

            if (!currentTabId || tabs.length === 0) {
                content.innerHTML = `<div class="text-center py-20 text-zinc-500">No tabs yet.<br>Tap "Add Tab" to get started.</div>`;
                return;
            }

            const tab = tabs.find(t => t.id === currentTabId);
            if (!tab) return;

            let html = `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-semibold">${tab.name}</h2>
                    <button onclick="showAddModal()" 
                            class="flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-black px-6 py-3 rounded-2xl font-medium">
                        <i class="fas fa-plus"></i> Add Task
                    </button>
                </div>
            `;

            const groups = {0: [], 1: [], 2: []};
            tab.tasks.forEach(task => groups[task.priority].push(task));

            const priorityNames = ['High Priority', 'Medium Priority', 'Low Priority'];
            const priorityClasses = ['priority-high bg-red-950/30', 'priority-med bg-yellow-950/30', 'priority-low bg-green-950/30'];

            let hasContent = false;
            [0,1,2].forEach(prio => {
                if (groups[prio].length === 0) return;
                hasContent = true;
                
                html += `
                    <div class="mb-8">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="text-xs uppercase tracking-widest font-mono text-zinc-500">${priorityNames[prio]}</div>
                            <div class="flex-1 h-px bg-zinc-800"></div>
                        </div>
                        <div class="space-y-3">
                `;

                groups[prio].forEach(task => {
                    html += `
                        <div class="group bg-zinc-900 border ${priorityClasses[prio]} rounded-3xl p-5 flex items-start gap-4">
                            <div class="flex-1 text-lg leading-tight">${task.text}</div>
                            <div class="flex flex-col items-end gap-3">
                                ${getPriorityHTML(task, tab.id)}
                                <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onclick="moveTask(${tab.id}, ${task.id}, -1)" class="w-8 h-8 flex items-center justify-center hover:bg-zinc-800 rounded-xl text-zinc-400 hover:text-white">
                                        <i class="fas fa-chevron-up"></i>
                                    </button>
                                    <button onclick="moveTask(${tab.id}, ${task.id}, 1)" class="w-8 h-8 flex items-center justify-center hover:bg-zinc-800 rounded-xl text-zinc-400 hover:text-white">
                                        <i class="fas fa-chevron-down"></i>
                                    </button>
                                    <button onclick="armDelete(this, ${tab.id}, ${task.id})" title="Double-click to delete" class="delete-btn w-8 h-8 flex items-center justify-center rounded-xl text-zinc-400 hover:text-red-400 transition-all">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            if (!hasContent) {
                html += `<div class="text-center py-20 text-zinc-500">No tasks yet.<br>Tap "Add Task" to get started.</div>`;
            }

            content.innerHTML = html;
            armedBtn = null;
            if (armedTimer) { clearTimeout(armedTimer); armedTimer = null; }
        }

        function changePriority(tabId, taskId, e) {
            e.stopImmediatePropagation();
            const tab = tabs.find(t => t.id === tabId);
            if (!tab) return;
            const task = tab.tasks.find(t => t.id === taskId);
            if (!task) return;
            task.priority = (task.priority + 1) % 3;
            saveData();
            renderCurrentTab();
        }

        function showAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
            const input = document.getElementById('new-task-input');
            input.value = '';
            input.focus();
            input.onkeydown = (e) => { if (e.key === 'Enter') addTask(); };
            window.selectedPriority = 2;
            updatePriorityButtons();
        }

        function closeModal() {
            document.getElementById('add-modal').classList.add('hidden');
        }

        function selectPriority(prio) {
            window.selectedPriority = prio;
            updatePriorityButtons();
        }

        function updatePriorityButtons() {
            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`prio-${i}`);
                if (btn) btn.classList.toggle('ring-2', i === window.selectedPriority);
            }
        }

        function addTask() {
            const input = document.getElementById('new-task-input');
            const text = input.value.trim();
            if (!text) return;

            const tab = tabs.find(t => t.id === currentTabId);
            if (tab) {
                tab.tasks.push({ id: nextTaskId++, text: text, priority: window.selectedPriority ?? 2 });
                saveData();
                closeModal();
                renderCurrentTab();
            }
        }

        let armedBtn = null;
        let armedTimer = null;

        function armDelete(btn, tabId, taskId) {
            // If this button is already armed, treat second click as confirm
            if (armedBtn === btn) {
                clearTimeout(armedTimer);
                armedBtn = null;
                deleteTask(tabId, taskId);
                return;
            }
            // Disarm any previously armed button
            if (armedBtn) disarmDelete(armedBtn);

            // Arm this button
            armedBtn = btn;
            btn.classList.add('bg-red-500/20', 'text-red-400', 'ring-1', 'ring-red-500');
            btn.title = 'Click again to confirm delete';

            armedTimer = setTimeout(() => {
                disarmDelete(btn);
                armedBtn = null;
            }, 2500);
        }

        function disarmDelete(btn) {
            btn.classList.remove('bg-red-500/20', 'text-red-400', 'ring-1', 'ring-red-500');
            btn.title = 'Double-click to delete';
        }

        function deleteTask(tabId, taskId) {
            const tab = tabs.find(t => t.id === tabId);
            if (tab) {
                tab.tasks = tab.tasks.filter(t => t.id !== taskId);
                saveData();
                renderCurrentTab();
            }
        }

        function moveTask(tabId, taskId, direction) {
            const tab = tabs.find(t => t.id === tabId);
            if (!tab) return;

            const index = tab.tasks.findIndex(t => t.id === taskId);
            if (index === -1) return;

            const task = tab.tasks[index];
            const samePrio = tab.tasks.filter(t => t.priority === task.priority);
            const currentPos = samePrio.findIndex(t => t.id === taskId);
            const newPos = currentPos + direction;
            if (newPos < 0 || newPos >= samePrio.length) return;

            const targetIndex = tab.tasks.findIndex(t => t.id === samePrio[newPos].id);
            [tab.tasks[index], tab.tasks[targetIndex]] = [tab.tasks[targetIndex], tab.tasks[index]];

            saveData();
            renderCurrentTab();
        }

        function addNewTab() {
            const name = prompt("New tab name (e.g. Medical Emergencies):");
            if (!name || !name.trim()) return;

            tabs.push({ id: nextTabId++, name: name.trim(), tasks: [] });
            saveData();
            currentTabId = tabs[tabs.length - 1].id;
            renderTabs();
            renderCurrentTab();
        }

        function saveData() {
            localStorage.setItem('responsesData', JSON.stringify({ tabs, nextTaskId, nextTabId, currentTabId }));
        }

        function loadData() {
            const saved = localStorage.getItem('responsesData');
            if (saved) {
                const data = JSON.parse(saved);
                tabs = data.tabs || tabs;
                nextTaskId = data.nextTaskId || nextTaskId;
                nextTabId = data.nextTabId || nextTabId;
                // Restore last active tab, fall back to first tab if it no longer exists
                if (data.currentTabId && tabs.find(t => t.id === data.currentTabId)) {
                    currentTabId = data.currentTabId;
                } else if (tabs.length > 0) {
                    currentTabId = tabs[0].id;
                }
            }
        }

        function init() {
            loadData();
            renderTabs();
            renderCurrentTab();
        }

        window.onload = init;
    </script>
</body>
</html>
